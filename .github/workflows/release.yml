name: Publish Release
on:
  workflow_dispatch:
jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.TEAM_RESOURCEFUL_BOT }}

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set Gradle Perms
        run: chmod +x gradlew

      - name: Get MC Version and Version
        id: props
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: "./gradle.properties"
          properties: "version mcVersion"

      - name: Publish package
        run: ./gradlew build --info
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASSWORD }}

      ### Need to duplicate this block for fabric
      - name: Upload Releases (Curse/Modrinth/Github)
        id: release
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          curseforge-id: ${{ vars.CURSE_ID }}
          curseforge-token: ${{ secrets.CURSE_API_KEY }}

          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_API_KEY }}

          github-tag: "v${{ steps.props.outputs.version }}"
          github-token: ${{ secrets.TEAM_RESOURCEFUL_BOT }}

          files: ./build/libs/!(*-@(dev|sources|dev-shadow)).jar
          name: "Highlight ${{ steps.props.outputs.version }}"
          version: ${{ steps.props.outputs.version }}
          changelog-file: changelog.md
          loaders: |
            neoforge
            fabric
          game-versions: ${{ steps.props.outputs.mcVersion }}
          version-resolver: exact
          environment: client

      - name: Create Discord Embed
        run: ./gradlew injectDiscord
        env:
          FORGE_RELEASE_URL: ${{ steps.forge_release.outputs.modrinth-version }}
          FABRIC_RELEASE_URL: ${{ steps.fabric_release.outputs.modrinth-version }}

      - name: Send Discord Webhook
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          raw-data: ./build/embed.json

      - name: Commit Version Updates
        run: |
          git config --global user.name "TeamResourcefulBot"
          git config --global user.email "teamresourcefulbot@users.noreply.github.com"
          git diff-index --quiet HEAD || { git commit -am "Released v${{ steps.props.outputs.version }}"; git push; }
